name: Apply Codex ATU review fixes

on:
  push:
    branches:
      - research/atu-loss-model

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message || '', 'Run Codex ATU review fixes')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed patch
        shell: bash
        run: |
          python - <<'PYHEX'
          from pathlib import Path

          encoded = """"""
          Path('/tmp/atu-review.patch.xz').write_bytes(bytes.fromhex(encoded))
          PYHEX
          xz -dc /tmp/atu-review.patch.xz > /tmp/atu-review.patch
          git apply --check /tmp/atu-review.patch
          git apply /tmp/atu-review.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NEXT_EXPERIMENT.md data/measured/atu_states_template.csv src/antenna_lab/atu.py tests/test_atu.py
          git commit -m 'Address Codex ATU review comments'
          git push origin HEAD:research/atu-loss-model
