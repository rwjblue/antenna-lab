name: Patch KH1 NEC source path length

on:
  workflow_dispatch:
  push:
    branches:
      - research/kh1-portable-nec

permissions:
  contents: write

jobs:
  patch-source:
    if: github.ref == 'refs/heads/research/kh1-portable-nec'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shorten direct-fed NEC filenames
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/antenna_lab/kh1_nec.py")
          source = path.read_text(encoding="utf-8")
          old = '''    stem = (
              f"direct-{candidate_id}-{deployment_id}-{ground_id}-"
              f"{conductivity_id}-{band}"
          )
          '''
          new = '''    case_identity = (
              f"{candidate_id}|{deployment_id}|{ground_id}|"
              f"{conductivity_id}|{band}"
          )
          stem = (
              f"d-{candidate_id}-"
              f"{hashlib.sha256(case_identity.encode()).hexdigest()[:12]}"
          )
          '''
          if old not in source:
              raise SystemExit("Expected direct-fed NEC stem block was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          python3 -m compileall -q src tests

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: kh1-nec-path-length-patch-${{ github.run_id }}
          path: src/antenna_lab/kh1_nec.py
          if-no-files-found: error
          retention-days: 30

      - name: Commit source-only patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/antenna_lab/kh1_nec.py
          git diff --cached --stat
          git commit -m 'Shorten direct-fed NEC working filenames [skip ci]'
          git push origin HEAD:research/kh1-portable-nec
