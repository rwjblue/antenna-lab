name: KH1 NEC-2 study

on:
  workflow_dispatch:
  push:
    branches:
      - research/kh1-portable-nec
  pull_request:
    paths:
      - ".github/workflows/kh1-nec-study.yml"
      - "data/measured/**"
      - "src/antenna_lab/cli.py"
      - "src/antenna_lab/kh1_nec.py"
      - "src/antenna_lab/kh1_pipeline.py"
      - "src/antenna_lab/nec.py"
      - "src/antenna_lab/transmission_line.py"
      - "tests/test_kh1_*.py"

permissions:
  contents: read

concurrency:
  group: kh1-nec-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.3"
  PYTHON_VERSION: "3.12"
  ARTIFACT_RETENTION_DAYS: "90"

jobs:
  quality:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install "$PYTHON_VERSION"
          uv sync --frozen --no-editable --group dev

      - name: Critical lint
        run: uv run ruff check --select E4,E7,E9,F src tests

      - name: Compile Python sources
        run: uv run python -m compileall -q src tests

      - name: Run tests
        run: uv run pytest

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: kh1-source-${{ github.run_id }}
          path: |
            .github/workflows/kh1-nec-study.yml
            configs
            data/measured
            src
            tests
            MODEL_LIMITATIONS.md
            NEXT_EXPERIMENT.md
            README.md
            pyproject.toml
            uv.lock
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  doublet-nec:
    name: Doublet NEC shard ${{ matrix.shard }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    steps:
      - uses: actions/checkout@v4

      - name: Install NEC-2 solver
        run: |
          sudo apt-get update
          sudo apt-get install --yes nec2c
          nec2c -v

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv python install "$PYTHON_VERSION"
          uv sync --frozen --no-editable

      - name: Run doublet NEC shard
        shell: bash
        run: |
          output="/tmp/kh1-doublet-nec-${{ matrix.shard }}"
          set +e
          uv run antenna-lab run-kh1-doublet-nec-shard \
            --output "$output" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 2 \
            --jobs 6 2>&1 | tee /tmp/kh1-doublet-nec.log
          status=${PIPESTATUS[0]}
          set -e
          mkdir -p "$output"
          cp /tmp/kh1-doublet-nec.log "$output/runner.log"
          exit "$status"

      - name: Upload doublet NEC shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kh1-doublet-nec-${{ github.run_id }}-${{ matrix.shard }}
          path: /tmp/kh1-doublet-nec-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  direct-nec:
    name: Direct-fed NEC shard ${{ matrix.shard }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    steps:
      - uses: actions/checkout@v4

      - name: Install NEC-2 solver
        run: |
          sudo apt-get update
          sudo apt-get install --yes nec2c
          nec2c -v

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv python install "$PYTHON_VERSION"
          uv sync --frozen --no-editable

      - name: Run direct-fed NEC shard
        shell: bash
        run: |
          output="/tmp/kh1-direct-nec-${{ matrix.shard }}"
          set +e
          uv run antenna-lab run-kh1-direct-nec-shard \
            --output "$output" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 2 \
            --jobs 6 2>&1 | tee /tmp/kh1-direct-nec.log
          status=${PIPESTATUS[0]}
          set -e
          mkdir -p "$output"
          cp /tmp/kh1-direct-nec.log "$output/runner.log"
          exit "$status"

      - name: Upload direct-fed NEC shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kh1-direct-nec-${{ github.run_id }}-${{ matrix.shard }}
          path: /tmp/kh1-direct-nec-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  doublet-grid:
    name: Doublet grid shard ${{ matrix.shard }}
    needs: [quality, doublet-nec]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v4

      - name: Download all doublet NEC shards
        uses: actions/download-artifact@v4
        with:
          pattern: kh1-doublet-nec-${{ github.run_id }}-*
          path: /tmp/kh1-inputs
          merge-multiple: true

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv python install "$PYTHON_VERSION"
          uv sync --frozen --no-editable

      - name: Evaluate doublet grid shard
        shell: bash
        run: |
          output="/tmp/kh1-doublet-grid-${{ matrix.shard }}"
          set +e
          uv run antenna-lab run-kh1-doublet-grid-shard \
            --input /tmp/kh1-inputs \
            --output "$output" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 8 2>&1 | tee /tmp/kh1-doublet-grid.log
          status=${PIPESTATUS[0]}
          set -e
          mkdir -p "$output"
          cp /tmp/kh1-doublet-grid.log "$output/runner.log"
          exit "$status"

      - name: Upload doublet grid shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kh1-doublet-grid-${{ github.run_id }}-${{ matrix.shard }}
          path: /tmp/kh1-doublet-grid-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  assemble:
    name: Assemble and verify result package
    needs: [quality, doublet-nec, direct-nec, doublet-grid]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download doublet NEC shards
        uses: actions/download-artifact@v4
        with:
          pattern: kh1-doublet-nec-${{ github.run_id }}-*
          path: /tmp/kh1-inputs
          merge-multiple: true

      - name: Download direct-fed NEC shards
        uses: actions/download-artifact@v4
        with:
          pattern: kh1-direct-nec-${{ github.run_id }}-*
          path: /tmp/kh1-inputs
          merge-multiple: true

      - name: Download doublet grid shards
        uses: actions/download-artifact@v4
        with:
          pattern: kh1-doublet-grid-${{ github.run_id }}-*
          path: /tmp/kh1-inputs
          merge-multiple: true

      - name: Install NEC-2 solver
        run: |
          sudo apt-get update
          sudo apt-get install --yes nec2c
          nec2c -v

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv python install "$PYTHON_VERSION"
          uv sync --frozen --no-editable

      - name: Assemble canonical result package
        shell: bash
        run: |
          mkdir -p /tmp/kh1-assembly
          set +e
          uv run antenna-lab assemble-kh1-nec-study \
            --input /tmp/kh1-inputs \
            --output /tmp/kh1-portable-nec-v2 \
            2>&1 | tee /tmp/kh1-assembly/runner.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Verify generated manifest
        run: uv run antenna-lab verify-results /tmp/kh1-portable-nec-v2

      - name: Add report to workflow summary
        run: cat /tmp/kh1-portable-nec-v2/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete result set
        uses: actions/upload-artifact@v4
        with:
          name: kh1-portable-nec-v2-${{ github.run_id }}
          path: /tmp/kh1-portable-nec-v2
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          compression-level: 6

      - name: Upload assembly diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kh1-assembly-diagnostics-${{ github.run_id }}
          path: |
            /tmp/kh1-assembly
            /tmp/kh1-portable-nec-v2
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
