name: Apply ATU loss model patch

on:
  push:
    branches:
      - research/atu-loss-model

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Start ATU loss patch bootstrap')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply patch
        run: |
          cat .bootstrap/atu/chunk-* | base64 --decode > /tmp/atu-loss-model.tar.xz
          tar -xJf /tmp/atu-loss-model.tar.xz -C "$GITHUB_WORKSPACE"
          rm -rf .bootstrap/atu
          rm .github/workflows/bootstrap-atu-loss.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add loss-aware ATU modeling and sharded study'
          git push origin HEAD:research/atu-loss-model
