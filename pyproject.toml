[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "antenna-lab"
version = "0.1.0"
description = "Reproducible amateur-radio antenna modeling and optimization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rob Jackson", email = "rwjblue@users.noreply.github.com" }]
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.10,<4"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
antenna-lab = "antenna_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/antenna_lab"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
